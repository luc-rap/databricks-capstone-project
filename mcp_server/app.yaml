# Job Search MCP Server App Configuration
# Deploy this as a separate Databricks App from the dashboard
#
# This MCP server provides job search and application tracking tools
# using Lakebase Postgres as the backend data store.

command:
  - "python"
  - "job_search_mcp_server.py"

env:
  - name: LOG_LEVEL
    value: "INFO"
  # Lakebase connection secrets are accessed via Databricks SDK
  # The adapter reads from the "database" secret scope:
  #   - lakebase-url: Connection URL
  #   - lakebase-endpoint: Endpoint resource name (optional, will auto-discover)
  #
  # No explicit environment variables needed here - the SDK handles authentication
