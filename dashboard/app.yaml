command:
  - "python"
  - "app.py"

# OAuth scopes required by the app
# model-serving: Required to call Databricks Foundation Model endpoints
scopes:
  - model-serving

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: PORT
    value: "8080"
  # FLASK_SECRET_KEY should be set via Databricks secret or environment variable
  # DO NOT hardcode secret keys in version control
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  # For now, app.py will generate one at runtime if not provided
