# Databricks Declarative Automation Bundle (DAB)
# Configuration for AI Job Hunting Copilot

bundle:
  name: job-hunting-copilot

workspace:
  host: ${DATABRICKS_HOST}

resources:
  apps:
    job-search-mcp:
      name: job-search-mcp-server
      description: "MCP server for AI job search tools"
      config:
        command:
          - python
          - job_search_mcp_server.py
        env:
          - name: ADZUNA_APP_ID
            valueFrom:
              secretKeyRef:
                scope: adzuna
                key: app-id
          - name: ADZUNA_APP_KEY
            valueFrom:
              secretKeyRef:
                scope: adzuna
                key: app-key
      source_code_path: mcp_server/

    job-hunting-dashboard:
      name: job-hunting-dashboard
      description: "AI Job Hunting Copilot frontend"
      config:
        command:
          - python
          - "-m"
          - streamlit
          - run
          - app.py
          - "--server.port=8080"
        env:
          - name: LAKEBASE_SECRET_SCOPE
            value: database
          - name: LAKEBASE_SECRET_KEY
            value: lakebase-url
      source_code_path: dashboard/

  jobs:
    ingest-job-postings:
      name: ingest-job-postings-daily
      description: "Daily job posting ingestion from Adzuna API"
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"  # Daily at 8 AM
        timezone_id: "America/Los_Angeles"
      tasks:
        - task_key: ingest_jobs
          notebook_task:
            notebook_path: dashboard/notebooks/ingest_job_embeddings
          existing_cluster_id: ${var.cluster_id}
