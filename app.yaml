command:
  - "python"
  - "dashboard/app.py"

# OAuth scopes required by the app
# model-serving: Required to call Databricks Foundation Model endpoints
scopes:
  - model-serving

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: PORT
    value: "8080"
  - name: FLASK_SECRET_KEY
    value: "change-this-in-production"
